<!DOCTYPE html>
<html lang="en-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKOTC — Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07090f;--bg2:#0d1120;--surface:#131829;
      --border:rgba(255,255,255,0.08);--text:#f0f2ff;--muted:#8892a8;
      --gold:#f5a623;--gold2:#ffcc66;--green:#22c55e;
      --radius:16px;--font:'Inter',sans-serif;
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
    a{color:inherit;text-decoration:none}

    /* ── NAV ── */
    nav{position:sticky;top:0;z-index:100;background:rgba(7,9,15,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
    .nav-logo{font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);transition:color .2s;padding:7px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border)}
    .nav-back:hover{color:var(--gold);border-color:rgba(245,166,35,0.3)}

    /* ── HERO IMAGE ── */
    .post-hero{width:min(100% - 48px,960px);margin:28px auto 0;overflow:hidden;position:relative;background:transparent;border:0;border-radius:0}
    .post-hero img{width:100%;max-height:520px;object-fit:contain;display:block;background:transparent}
    .post-hero-gradient{display:none}
    .post-hero-fallback{width:100%;height:260px;background:linear-gradient(135deg,#0d1829 0%,#1a0f2e 50%,#0a1a10 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .post-hero-fallback::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,0.12) 0%,transparent 70%);top:-100px;left:-100px}
    .post-hero-fallback::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(42,171,238,0.1) 0%,transparent 70%);bottom:-80px;right:-80px}
    .post-hero-fallback-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0.5}
    .post-hero-fallback-inner svg{width:56px;height:56px}

    /* ── ARTICLE ── */
    .article-wrap{max-width:780px;margin:0 auto;padding:40px 24px 80px}
    .article-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
    .art-cat{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;padding:4px 12px;border-radius:100px}
    .cat-market{background:rgba(56,189,248,.16);color:#38bdf8;border:1px solid rgba(56,189,248,.30)}
    .cat-regulation{background:rgba(245,158,11,.16);color:#f59e0b;border:1px solid rgba(245,158,11,.30)}
    .cat-guide{background:rgba(34,197,94,.16);color:#22c55e;border:1px solid rgba(34,197,94,.30)}
    .cat-defi{background:rgba(168,85,247,.16);color:#a855f7;border:1px solid rgba(168,85,247,.30)}
    .cat-news{background:rgba(244,63,94,.16);color:#f43f5e;border:1px solid rgba(244,63,94,.30)}
    .cat-channel{background:rgba(42,171,238,.16);color:#2AABEE;border:1px solid rgba(42,171,238,.30)}
    .art-date{font-size:12px;color:var(--muted)}
    .art-source{font-size:12px;color:var(--muted)}
    .art-title{font-size:clamp(24px,4vw,40px);font-weight:900;line-height:1.2;letter-spacing:-1px;margin-bottom:16px}
    .art-excerpt{font-size:17px;color:var(--muted);line-height:1.7;margin-bottom:32px;padding-bottom:32px;border-bottom:1px solid var(--border)}
    .art-body{font-size:16px;line-height:1.9;color:rgba(240,242,255,.85);white-space:pre-line;word-break:break-word}
    .art-body h2{font-size:22px;font-weight:800;color:var(--text);margin:32px 0 12px}
    .art-body strong,.art-body b{color:var(--text);font-weight:700}
    .art-tags{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);font-size:13px;color:#4a9eff;line-height:1.8}

    /* ── CHANNEL POST STYLE ── */
    .ch-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
    .ch-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .ch-name{font-size:14px;font-weight:800;color:var(--text)}
    .ch-handle{font-size:12px;color:var(--muted);margin-top:1px}
    .ch-live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600;margin-top:3px}
    .ch-live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* ── SHARE ── */
    .post-actions{margin-top:40px;padding-top:32px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .share-label{font-size:12px;color:var(--muted);margin-right:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .share-icon{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .2s}
    .share-icon svg{width:17px;height:17px;display:block}
    .share-icon:hover{transform:translateY(-2px);color:#fff}
    .share-fb:hover{background:#1877f2;border-color:#1877f2}
    .share-tg:hover{background:#2AABEE;border-color:#2AABEE}
    .share-x:hover{background:#111827;border-color:#374151}

    /* ── RELATED / BACK SECTION ── */
    .back-section{max-width:780px;margin:0 auto;padding:0 24px 48px}
    .back-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;transition:all .2s;cursor:pointer;font-family:inherit}
    .back-btn:hover{border-color:rgba(245,166,35,.3);color:var(--gold)}

    /* ── SKELETON ── */
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skel{background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,.05) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}

    /* ── NOT FOUND ── */
    .not-found{text-align:center;padding:80px 24px}
    .not-found h2{font-size:24px;font-weight:800;margin-bottom:8px}
    .not-found p{color:var(--muted);margin-bottom:24px}

  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">HKOTC</a>
  <a href="/blog" class="nav-back">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span data-post-i18n="back">Back to Blog</span>
  </a>
</nav>

<div id="post-container"></div>

<div class="back-section">
  <button class="back-btn" onclick="history.back()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span data-post-i18n="back">Back to Blog</span>
  </button>
</div>

<script>
  const DEFAULT_REPO = 'nightwalkerr86-star/hkotc';
  const DEFAULT_BRANCH = 'main';
  const DEFAULT_BLOG_PATH = 'blog-posts.json';
  const DEFAULT_CHANNEL_PATH = 'channel-posts.json';
  const currentLang = localStorage.getItem('lang') || 'en';
  const POST_I18N = {
    en: {
      back: 'Back to Blog',
      share: 'Share:',
      notFoundTitle: 'Post not found',
      notFoundText: 'This post may have been removed or the link is incorrect.',
      officialChannel: 'Official Channel',
      locale: 'en-HK',
      dateOptions: { day:'numeric', month:'long', year:'numeric' },
      cats: { market:'Market', regulation:'Regulation', guide:'OTC Guide', defi:'DeFi', news:'News', channel:'Channel' }
    },
    zh: {
      back: '返回資訊',
      share: '分享：',
      notFoundTitle: '找不到文章',
      notFoundText: '此文章可能已被移除，或連結不正確。',
      officialChannel: '官方頻道',
      locale: 'zh-HK',
      dateOptions: { year:'numeric', month:'long', day:'numeric' },
      cats: { market:'市場', regulation:'監管', guide:'OTC 指南', defi:'DeFi', news:'新聞', channel:'頻道' }
    },
    km: {
      back: 'ត្រឡប់ទៅព័ត៌មាន',
      share: 'ចែករំលែក៖',
      notFoundTitle: 'រកមិនឃើញអត្ថបទ',
      notFoundText: 'អត្ថបទនេះអាចត្រូវបានលុប ឬតំណមិនត្រឹមត្រូវ។',
      officialChannel: 'ឆានែលផ្លូវការ',
      locale: 'km-KH',
      dateOptions: { day:'numeric', month:'long', year:'numeric' },
      cats: { market:'ទីផ្សារ', regulation:'បទប្បញ្ញត្តិ', guide:'មគ្គុទ្ទេសក៍ OTC', defi:'DeFi', news:'ព័ត៌មាន', channel:'ឆានែល' }
    }
  };
  const postLang = POST_I18N[currentLang] || POST_I18N.en;

  function applyPostLanguage() {
    document.documentElement.lang = currentLang === 'zh' ? 'zh-HK' : currentLang === 'km' ? 'km-KH' : 'en-HK';
    document.querySelectorAll('[data-post-i18n="back"]').forEach(el => { el.textContent = postLang.back; });
  }
  applyPostLanguage();

  function rawGithubUrl(filePath) {
    return `https://raw.githubusercontent.com/${DEFAULT_REPO}/${DEFAULT_BRANCH}/${filePath.replace(/^\/+/, '')}`;
  }

  function postUrls(type) {
    return type === 'channel'
      ? ['/channel-posts.json', 'channel-posts.json']
      : [rawGithubUrl(DEFAULT_BLOG_PATH), '/blog-posts.json', 'blog-posts.json'];
  }

  async function fetchFirstJson(urls) {
    let lastError;
    for (const source of urls) {
      const url = source;
      try {
        const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const payload = await res.json();
        const posts = Array.isArray(payload) ? payload : (payload.record || payload.posts || []);
        if (Array.isArray(posts)) return posts;
      } catch (error) {
        lastError = error;
      }
    }
    throw lastError || new Error('No posts found');
  }

  function categoryLabel(cat) {
    const key = normalizeCategoryKey(cat);
    return postLang.cats[key] || cat || postLang.cats.news;
  }

  function slugifyPostTitle(value) {
    return String(value || '')
      .normalize('NFKD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9\u4e00-\u9fff\u1780-\u17ff]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80) || ('post-' + Date.now());
  }

  function normalizeCategoryKey(value) {
    const raw = String(value || 'news').toLowerCase();
    if (raw.includes('regulation')) return 'regulation';
    if (raw.includes('guide') || raw.includes('otc')) return 'guide';
    if (raw.includes('defi')) return 'defi';
    if (raw.includes('channel')) return 'channel';
    if (raw.includes('market')) return 'news';
    return raw.replace(/[^a-z0-9]+/g, '') || 'news';
  }

  function safeText(value) {
    return String(value || '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
  }

  function normalizeBlogPost(post) {
    if (!post || typeof post !== 'object') return null;
    const title = post.title || 'Untitled post';
    const content = post.content || post.body || post.text || '';
    const dateSource = post.publishedAt || post.createdAt || post.updatedAt || post.date || new Date().toISOString();
    const parsedDate = typeof dateSource === 'number' ? new Date(dateSource * 1000) : new Date(dateSource);
    const isoDate = isNaN(parsedDate) ? new Date().toISOString() : parsedDate.toISOString();
    return {
      ...post,
      id: String(post.id || post.message_id || slugifyPostTitle(title)),
      title,
      slug: post.slug || slugifyPostTitle(title),
      category: post.category || 'Market News',
      excerpt: post.excerpt || String(content).slice(0, 180),
      content,
      coverImage: post.coverImage || post.photo || '',
      author: post.author || 'HKOTC Desk',
      status: post.status || 'published',
      publishedAt: post.publishedAt || isoDate,
      createdAt: post.createdAt || isoDate,
      updatedAt: post.updatedAt || isoDate,
      tags: Array.isArray(post.tags) ? post.tags : [],
    };
  }

  function fmtDate(ts) {
    const d = typeof ts === 'number' ? new Date(ts * 1000) : new Date(ts);
    return isNaN(d) ? '' : d.toLocaleDateString(postLang.locale, postLang.dateOptions);
  }

  function setBlogPostingSchema(p, type) {
    document.querySelectorAll('script[data-dynamic-schema]').forEach(el => el.remove());
    const blog = type === 'channel' ? p : normalizeBlogPost(p);
    const title = blog.title || (blog.text || '').slice(0, 80) || 'HKOTC Post';
    const description = blog.excerpt || (blog.content || blog.body || blog.text || '').slice(0, 180);
    const id = blog.id || blog.message_id || '';
    const publishedAt = blog.publishedAt || blog.date || new Date().toISOString();
    const image = blog.coverImage || blog.photo || 'https://hkotc.io/og-image.jpg';
    const schema = {
      '@context': 'https://schema.org',
      '@type': type === 'channel' ? 'SocialMediaPosting' : 'BlogPosting',
      headline: title,
      description,
      image: [image],
      datePublished: typeof publishedAt === 'number' ? new Date(publishedAt * 1000).toISOString() : publishedAt,
      dateModified: blog.updatedAt || (typeof publishedAt === 'number' ? new Date(publishedAt * 1000).toISOString() : publishedAt),
      author: { '@type': 'Organization', name: blog.author || 'HKOTC', url: 'https://hkotc.io/' },
      publisher: { '@type': 'Organization', name: 'HKOTC', url: 'https://hkotc.io/', logo: { '@type': 'ImageObject', url: 'https://hkotc.io/og-image.jpg' } },
      mainEntityOfPage: { '@type': 'WebPage', '@id': `https://hkotc.io/post?slug=${encodeURIComponent(blog.slug || id)}` },
      articleSection: blog.category || type,
      keywords: Array.isArray(blog.tags) ? blog.tags.join(', ') : ''
    };
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.dataset.dynamicSchema = 'post';
    script.textContent = JSON.stringify(schema);
    document.head.appendChild(script);
  }

  function shareActions(title) {
    const url = encodeURIComponent(location.href);
    const text = encodeURIComponent(title || 'HKOTC');
    return `
        <div class="post-actions">
          <span class="share-label">${postLang.share}</span>
          <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" rel="noopener noreferrer" class="share-icon share-fb" aria-label="Share on Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8.5h3V5h-3c-3.1 0-5 1.9-5 5v2H6v3.6h3V23h4v-7.4h3.1l.6-3.6H13v-1.7c0-1.1.4-1.8 1-1.8Z"/></svg>
          </a>
          <a href="https://t.me/share/url?url=${url}&text=${text}" target="_blank" rel="noopener noreferrer" class="share-icon share-tg" aria-label="Share on Telegram">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </a>
          <a href="https://twitter.com/intent/tweet?url=${url}&text=${text}" target="_blank" rel="noopener noreferrer" class="share-icon share-x" aria-label="Share on Twitter">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2h3.3l-7.2 8.2L23.5 22h-6.7l-5.2-6.8L5.6 22H2.3l7.7-8.8L1.8 2h6.9l4.7 6.2L18.9 2Zm-1.2 17.9h1.8L7.7 4H5.8l11.9 15.9Z"/></svg>
          </a>
        </div>`;
  }

  function renderBlogPost(rawPost) {
    const p = normalizeBlogPost(rawPost);
    const cat = p.category || 'Market News';
    const catKey = normalizeCategoryKey(cat);
    const tags = (p.tags || []).map(t => '#' + safeText(t)).join(' ');
    const contentHtml = safeText(p.content || '').replace(/\n/g, '<br>');
    return `
      ${p.coverImage ? `<div class="post-hero"><img src="${safeText(p.coverImage)}" alt="${safeText(p.title)}" onerror="this.parentElement.style.display='none'"><div class="post-hero-gradient"></div></div>` : ''}
      <div class="article-wrap">
        <div class="article-meta">
          <span class="art-cat cat-${catKey}">${safeText(categoryLabel(cat))}</span>
          <span class="art-date">${fmtDate(p.publishedAt)}</span>
          <span class="art-source">${safeText(p.author || 'HKOTC Desk')}</span>
        </div>
        <h1 class="art-title">${safeText(p.title)}</h1>
        ${p.excerpt ? `<p class="art-excerpt">${safeText(p.excerpt)}</p>` : ''}
        <div class="art-body">${contentHtml}</div>
        ${tags ? `<div class="art-tags">${tags}</div>` : ''}
        ${shareActions(p.title)}
      </div>`;
  }

  function renderChannelPost(p) {
    const lines = (p.text || '').split('\n');
    const hi = lines.findIndex(l => /^#\S/.test(l.trim()));
    const body = hi > -1 ? lines.slice(0, hi).join('\n').trim() : (p.text || '').trim();
    const tags = hi > -1 ? lines.slice(hi).join(' ').trim() : '';
    const tgLink = p.message_link || `https://t.me/${p.channel || 'hkotcdesk'}`;
    return `
      ${p.photo
        ? `<div class="post-hero"><img src="${p.photo}" alt="" onerror="this.parentElement.style.display='none'"><div class="post-hero-gradient"></div></div>`
        : `<div class="post-hero-fallback"><div class="post-hero-fallback-inner"><svg viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg><span style="font-size:13px;color:var(--gold);font-weight:700">港汇加密交易台</span></div></div>`
      }
      <div class="article-wrap">
        <div class="ch-header">
          <div class="ch-avatar">港</div>
          <div>
            <div class="ch-name">港汇加密交易台 | HK OTC Desk</div>
            <div class="ch-live"><span class="ch-live-dot"></span> ${postLang.officialChannel}</div>
          </div>
        </div>
        <div class="art-body" style="font-size:17px;line-height:1.85">${body.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        ${tags ? `<div class="art-tags" style="margin-top:20px">${tags}</div>` : ''}
        <div class="article-meta" style="margin-top:20px"><span class="art-date">${fmtDate(p.date)}</span></div>
        ${shareActions(body.slice(0, 90) || 'HKOTC')}
      </div>`;
  }

  function showSkeleton() {
    document.getElementById('post-container').innerHTML = `
      <div class="article-wrap">
        <div class="article-meta"><div class="skel" style="height:22px;width:90px"></div><div class="skel" style="height:14px;width:120px;margin-left:8px"></div></div>
        <div class="skel" style="height:40px;width:80%;margin-bottom:12px"></div>
        <div class="skel" style="height:40px;width:60%;margin-bottom:32px"></div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${Array(6).fill('<div class="skel" style="height:16px;width:100%"></div>').join('')}
        </div>
      </div>`;
  }

  function showNotFound() {
    document.getElementById('post-container').innerHTML = `
      <div class="not-found">
        <h2>${postLang.notFoundTitle}</h2>
        <p>${postLang.notFoundText}</p>
        <a href="/blog" class="back-btn">← ${postLang.back}</a>
      </div>`;
  }

  async function loadPost() {
    const params = new URLSearchParams(location.search);
    const type = params.get('type') || 'blog';
    const slug = params.get('slug');
    const id = params.get('id');

    if (type === 'blog' && !slug && !id) { showNotFound(); return; }
    if (type !== 'blog' && !id) { showNotFound(); return; }
    showSkeleton();

    try {
      const posts = await fetchFirstJson(postUrls(type));
      const normalizedPosts = type === 'blog' ? posts.map(normalizeBlogPost).filter(Boolean) : posts;
      const post = type === 'blog'
        ? normalizedPosts.find(p => (slug && p.slug === slug) || (id && String(p.id) === String(id)))
        : normalizedPosts.find(p => String(p.id || p.message_id) === String(id));

      if (!post || (type === 'blog' && post.status !== 'published')) { showNotFound(); return; }

      document.title = (post.title || post.text?.slice(0,60) || 'Post') + ' — HKOTC';
      setBlogPostingSchema(post, type);

      document.getElementById('post-container').innerHTML =
        type === 'channel' ? renderChannelPost(post) : renderBlogPost(post);
    } catch (e) {
      showNotFound();
    }
  }

  loadPost();
</script>
</body>
</html>
